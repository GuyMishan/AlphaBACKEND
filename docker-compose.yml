services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: alpha
      POSTGRES_USER: alpha
      POSTGRES_PASSWORD: alpha_dev_only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alpha -d alpha"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - alpha_postgres:/var/lib/postgresql/data

volumes:
  alpha_postgres:
