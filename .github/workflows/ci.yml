name: backend-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: alpha_test
          POSTGRES_PASSWORD: alpha_test
          POSTGRES_DB: alpha_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alpha_test -d alpha_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ALPHA_TEST_POSTGRES: Host=localhost;Port=5432;Database=alpha_test;Username=alpha_test;Password=alpha_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore AlphaBackend.slnx
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          dotnet build AlphaBackend.slnx --no-restore --configuration Release 2>&1 | tee build.log
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-build-log
          path: build.log
          if-no-files-found: ignore
      - run: dotnet test --solution AlphaBackend.slnx --no-build --configuration Release
