name: backend-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore AlphaBackend.slnx
      - run: dotnet build AlphaBackend.slnx --no-restore --configuration Release
      - run: dotnet test AlphaBackend.slnx --no-build --configuration Release
