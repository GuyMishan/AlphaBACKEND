name: backend-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore AlphaBackend.slnx
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          dotnet build AlphaBackend.slnx --no-restore --configuration Release 2>&1 | tee build.log
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-build-log
          path: build.log
          if-no-files-found: ignore
      - run: dotnet test --solution AlphaBackend.slnx --no-build --configuration Release
