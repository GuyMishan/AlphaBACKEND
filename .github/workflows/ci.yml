name: backend-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore AlphaBackend.slnx
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          dotnet build AlphaBackend.slnx --no-restore --configuration Release 2>&1 | tee build.log
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-build-log
          path: build.log
          if-no-files-found: ignore
      - run: dotnet test --solution AlphaBackend.slnx --no-build --configuration Release
      - name: Probe CardCom public sandbox usernames
        shell: bash
        run: |
          set -euo pipefail
          for name in Cardcomtest26 test2025 cardtest26 pGpgO8S1VFLyBpVhi1Xp; do
            echo "=== $name ==="
            curl -sS -X POST 'https://secure.cardcom.solutions/api/v11/LowProfile/Create' \
              -H 'Content-Type: application/json' \
              --data "{\"TerminalNumber\":1000,\"ApiName\":\"$name\",\"Amount\":1,\"Operation\":\"CreateTokenOnly\",\"SuccessRedirectUrl\":\"https://example.com/success\",\"FailedRedirectUrl\":\"https://example.com/fail\",\"WebHookUrl\":\"https://example.com/webhook\",\"ProductName\":\"ALPHA sandbox probe\",\"Language\":\"he\",\"ISOCoinId\":1}"
            echo
          done
